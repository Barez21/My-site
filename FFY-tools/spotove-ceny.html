<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spotové ceny</title>
<meta name="description" content="Spotové ceny elektřiny a plynu z OTE za poslední dva roky. Graf s odečtem ceny v libovolné chvíli.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>if (window.self !== window.top) document.documentElement.classList.add('embedded');</script>
<style>
  :root {
    --blue:#214571; --blue-d:#18314E; --green:#45e7a3; --green-d:#1AC77F; --ink:#0a141e; --bronze:#e8af46; --bronze-d:#C88A19;
    --bg:#eff4fa; --white:#fff; --muted:#548bc9; --line:#d0dff0; --border:#e3e8ef; --grid:#e6edf6; --band:#d0dff0;
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html,body { margin:0; }
  body { font-family:'Albert Sans','Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,sans-serif; background:var(--bg); color:var(--blue); line-height:1.45; }
  .wrap { max-width:1180px; margin:0 auto; padding:32px 16px 56px; position:relative; z-index:1; }
  .arc { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  .brand svg { height:31px; width:auto; display:block; margin-bottom:24px; }
  .embedded .brand { display:none; }
  .embedded .wrap { padding-top:24px; }
  .eyebrow { display:inline-block; background:var(--green); color:var(--ink); font-size:13px; font-weight:700; padding:3px 8px; border-radius:2px; }
  h1 { font-size:clamp(28px,4.5vw,38px); font-weight:800; line-height:1.15; margin:12px 0 6px; }
  .perex { font-size:16px; margin:0 0 20px; color:var(--blue); }
  .perex small { color:var(--muted); }

  /* ovládání */
  .bar { display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .seg { display:inline-flex; background:var(--white); border:1px solid var(--border); border-radius:10px; padding:3px; gap:2px; }
  .seg button { font:inherit; font-size:14px; font-weight:600; color:var(--blue); background:none; border:0; border-radius:7px; padding:7px 12px; cursor:pointer; white-space:nowrap; }
  .seg button[aria-pressed="true"] { background:var(--blue); color:#fff; }
  .seg button:focus-visible, .btn:focus-visible { outline:2px solid var(--green); outline-offset:2px; }
  .seg.big button { font-size:15px; padding:8px 16px; }
  .btn { font:inherit; font-size:14px; font-weight:600; color:var(--ink); background:var(--white); border:1px solid var(--border); border-radius:8px; padding:8px 12px; cursor:pointer; }
  .btn:hover { background:var(--bg); }

  /* karty */
  .kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; margin-bottom:14px; }
  .kpi { background:var(--white); border:1px solid var(--border); border-radius:21px 0 21px 0; padding:14px 16px; min-width:0; }
  .kpi.dark { background:var(--blue); border-color:var(--blue); color:#fff; }
  .kpi .k { font-size:12px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); }
  .kpi.dark .k { color:var(--green); }
  .kpi .v { font-size:26px; font-weight:800; line-height:1.15; margin-top:4px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .kpi .v small { font-size:13px; font-weight:700; margin-left:4px; }
  .kpi .s { font-size:13px; margin-top:2px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .kpi.dark .s { color:#b1cae7; }
  @media (max-width:820px) { .kpis { grid-template-columns:repeat(2,minmax(0,1fr)); } }

  /* graf */
  .chart-box { background:var(--white); border:1px solid var(--border); border-radius:21px 0 21px 0; padding:14px 14px 10px; }
  .chart-head { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin:0 4px 8px; }
  .chart-head .range { font-weight:700; font-variant-numeric:tabular-nums; }
  .chart-head .mode { font-size:13px; color:var(--muted); }
  .main { position:relative; height:400px; touch-action:pan-y; cursor:crosshair; user-select:none; -webkit-user-select:none; }
  .main.drag { cursor:grabbing; }
  canvas { display:block; width:100%; height:100%; }
  .nav { position:relative; height:64px; margin-top:10px; touch-action:none; user-select:none; -webkit-user-select:none; }
  .tip {
    position:absolute; pointer-events:none; background:var(--ink); color:#fff; border-radius:10px 0 10px 0;
    padding:8px 11px; font-size:13px; line-height:1.35; white-space:nowrap; z-index:2; display:none; box-shadow:0 6px 18px rgba(10,20,30,.18);
  }
  .tip b { font-size:17px; font-weight:800; font-variant-numeric:tabular-nums; }
  .tip .t { color:#b1cae7; }
  .tip .x { color:#93F1CA; font-variant-numeric:tabular-nums; }
  .hint { font-size:13px; color:var(--muted); margin:8px 4px 0; }
  .foot { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:16px; }
  .msg { background:var(--white); border-left:4px solid var(--bronze); border-radius:0 0 21px 0; padding:14px 18px; margin:20px 0; }
  @media (max-width:600px) {
    .main { height:300px; }
    .kpi { padding:12px 14px; }
    .kpi .v { font-size:21px; white-space:normal; }
    .kpi .v small { display:block; margin:0; font-size:12px; }
    .seg button { padding:7px 9px; font-size:13px; }
    #presets { width:100%; display:grid; grid-template-columns:repeat(3,1fr); }
    .bar .seg { flex:1 1 auto; } .bar .seg button { flex:1; }
    .chart-box { padding:12px 8px 8px; }
  }
  .chart-head > * { min-width:0; }
  .kpi .v { overflow-wrap:anywhere; }
</style>
</head>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var TZ = 'Europe/Prague', DAY = 864e5;
  var COL = { blue:'#214571', band:'rgba(84,139,201,.18)', grid:'#e6edf6', axis:'#548bc9', green:'#45e7a3', greenD:'#1AC77F', bronze:'#e8af46', neg:'rgba(232,175,70,.28)', ink:'#0a141e', navBand:'rgba(69,231,163,.22)' };
  var isTouch = matchMedia('(pointer:coarse)').matches;
  if (isTouch) $('hint').textContent = 'Posunem prstu po grafu odečtete cenu. Období vyberete tlačítky nebo posunutím výřezu ve spodním pruhu.';

  /* ---------- čas v pražském pásmu ---------- */
  var offFmt = new Intl.DateTimeFormat('en-US', { timeZone: TZ, timeZoneName: 'shortOffset' });
  function offsetMin(ms) { var p = offFmt.formatToParts(new Date(ms)).find(function (x) { return x.type === 'timeZoneName'; }).value; var m = p.match(/GMT([+-]\d+)(?::(\d+))?/); return m ? (+m[1]) * 60 + (m[1][0] === '-' ? -1 : 1) * (+(m[2] || 0)) : 0; }
  function midnight(key) { var y = +key.slice(0, 4), mo = +key.slice(5, 7) - 1, d = +key.slice(8, 10); var u = Date.UTC(y, mo, d); return u - offsetMin(u - 2 * 36e5) * 6e4; }
  var fDay = new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, weekday: 'short', day: 'numeric', month: 'numeric', year: 'numeric' });
  var fDate = new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, day: 'numeric', month: 'numeric', year: 'numeric' });
  var fTime = new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, hour: '2-digit', minute: '2-digit' });
  var fMon = new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, month: 'short', year: 'numeric' });
  var fDM = new Intl.DateTimeFormat('cs-CZ', { timeZone: TZ, day: 'numeric', month: 'numeric' });
  function nf(v, d) { return v == null || !isFinite(v) ? '–' : v.toLocaleString('cs-CZ', { minimumFractionDigits: d, maximumFractionDigits: d }); }

  /* ---------- stav ---------- */
  var RAW = { el: null, gas: null, kurz: null };
  var st = { kom: 'el', cur: 'eur', x0: 0, x1: 0 };
  try { var sv = JSON.parse(localStorage.getItem('ffy-spot') || '{}'); if (sv.kom) st.kom = sv.kom; if (sv.cur) st.cur = sv.cur; } catch (e) {}
  var S = null;   // připravené řady pro zvolenou komoditu a měnu

  function rateFor(key, rates, keys) {
    if (rates[key]) return rates[key];
    var lo = 0, hi = keys.length - 1, best = null;           // poslední známý kurz ke dni (víkendy, svátky)
    while (lo <= hi) { var m = (lo + hi) >> 1; if (keys[m] <= key) { best = keys[m]; lo = m + 1; } else hi = m - 1; }
    return best ? rates[best] : (keys.length ? rates[keys[0]] : 1);
  }

  function build() {
    var kom = st.kom, czk = st.cur === 'czk';
    var src = RAW[kom]; if (!src) return null;
    var rates = (RAW.kurz && RAW.kurz.dny) || {}, rk = Object.keys(rates).sort();
    var days = Object.keys(src.dny).sort();
    var t = [], v = [], dur = [], dt = [], dAvg = [], dMin = [], dMax = [], dKey = [];
    days.forEach(function (key) {
      var m0 = midnight(key), k = czk ? rateFor(key, rates, rk) : 1, val = src.dny[key];
      if (kom === 'gas') {
        var g = val * k; t.push(m0); v.push(g); dur.push(DAY); dt.push(m0); dAvg.push(g); dMin.push(g); dMax.push(g); dKey.push(key);
      } else {
        var r = val.r * 6e4, sum = 0, n = 0, mn = Infinity, mx = -Infinity;
        val.p.forEach(function (x, i) {
          if (x == null) return; var y = x * k;
          t.push(m0 + i * r); v.push(y); dur.push(r); sum += y; n++; if (y < mn) mn = y; if (y > mx) mx = y;
        });
        if (n) { dt.push(m0); dAvg.push(sum / n); dMin.push(mn); dMax.push(mx); dKey.push(key); }
      }
    });
    var end = t.length ? t[t.length - 1] + dur[dur.length - 1] : Date.now();
    return { t: t, v: v, dur: dur, dt: dt, dAvg: dAvg, dMin: dMin, dMax: dMax, dKey: dKey, start: t[0] || end - DAY, end: end, unit: czk ? 'Kč/MWh' : 'EUR/MWh', dec: czk ? 0 : 2, kom: kom };
  }

  function lowerIdx(arr, x) { var lo = 0, hi = arr.length; while (lo < hi) { var m = (lo + hi) >> 1; if (arr[m] < x) lo = m + 1; else hi = m; } return lo; }

  /* ---------- canvas ---------- */
  var cv = $('cv'), ctx = cv.getContext('2d'), nv = $('nv'), nctx = nv.getContext('2d'), main = $('main'), tip = $('tip');
  var W = 0, H = 0, NW = 0, NH = 0, DPR = 1;
  var PAD = { l: 58, r: 14, t: 12, b: 28 };
  function size() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = main.clientWidth; H = main.clientHeight; NW = $('navBox').clientWidth; NH = $('navBox').clientHeight;
    PAD.l = W < 500 ? 46 : 58;
    [[cv, W, H], [nv, NW, NH]].forEach(function (a) { a[0].width = Math.round(a[1] * DPR); a[0].height = Math.round(a[2] * DPR); });

      if (key === 'kom') setRange(st.kom === 'gas' ? 366 : 31); else redraw();
    };
  }

  /* ---------- CSV ---------- */
  $('csv').addEventListener('click', function () {
    var rows = [['cas_od', 'cas_do', 'cena_' + (st.cur === 'czk' ? 'kc_mwh' : 'eur_mwh')]];
    var iso = function (t) { var d = new Date(t), o = offsetMin(t), l = new Date(t + o * 6e4); return l.toISOString().slice(0, 16).replace('T', ' '); };
    if (S.kom === 'gas') { for (var i = lowerIdx(S.dt, st.x0); i < lowerIdx(S.dt, st.x1); i++) rows.push([S.dKey[i], S.dKey[i], S.dAvg[i].toFixed(2)]); }
    else { for (var j = lowerIdx(S.t, st.x0); j < lowerIdx(S.t, st.x1); j++) rows.push([iso(S.t[j]), iso(S.t[j] + S.dur[j]), S.v[j].toFixed(2)]); }
    var blob = new Blob(['﻿' + rows.map(function (r) { return r.join(';'); }).join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'spot-' + (S.kom === 'gas' ? 'plyn' : 'elektrina') + '-' + dayKey(st.x0) + '_' + dayKey(st.x1 - 1) + '.csv';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
  });

  /* ---------- start ---------- */
  function load(f) { return fetch('data/' + f, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(f + ': ' + r.status); return r.json(); }); }
  Promise.all([load('spot-elektrina.json'), load('spot-plyn.json'), load('kurz-eur.json').catch(function () { return null; })]).then(function (res) {
    RAW.el = res[0]; RAW.gas = res[1]; RAW.kurz = res[2];
    if (!RAW.kurz) { $('mena').style.display = 'none'; st.cur = 'eur'; }
    seg('komodita', 'kom'); seg('mena', 'cur');
    var upd = RAW.el.aktualizace ? new Date(RAW.el.aktualizace) : null;
    $('stamp').textContent = upd ? 'Aktualizováno ' + fDate.format(upd) + ' ' + fTime.format(upd) + '.' : '';
    $('src').textContent = 'Zdroj: OTE, a.s. (denní trh s elektřinou, vnitrodenní trh s plynem), kurz EUR/CZK: ČNB.';
    size(); S = build(); setRange(st.kom === 'gas' ? 366 : 31);
  }).catch(function (e) {
    var missing = /404/.test(e.message);
    $('kpis').hidden = true; $('navBox').hidden = true; $('hint').hidden = true; $('csv').hidden = true; $('presets').hidden = true;
    $('main').style.height = 'auto'; $('main').style.cursor = 'default';
    $('main').innerHTML = '<div class="msg" style="margin:8px 0">' + (missing
      ? '<b>Data zatím nejsou stažená.</b><br>Spotové ceny stahuje GitHub Action „Stáhnout spotové ceny (OTE + ČNB)“. V repozitáři otevřete záložku <b>Actions</b>, vyberte ji a klikněte na <b>Run workflow</b>. První stažení trvá 5–10 minut, potom se data aktualizují sama každý den odpoledne.'
      : '<b>Data se nepodařilo načíst.</b><br>' + e.message + '. Zkuste stránku obnovit.') + '</div>';
  });
  var rt = 0; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (!S) return; size(); redraw(); }, 80); });
  if (document.fonts) document.fonts.ready.then(function () { if (S) redraw(); });
})();
</script>
</body>
</html>
