<html lang="cs">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zjištění distribučního území podle PSČ</title>
<style>
  :root{--ink:#1a1a1a;--muted:#666;--line:#e4e4e7;--el:#0f62fe;--gas:#e8590c;--warn:#b54708;--warnbg:#fffaeb;--ok:#067647}

</style>
</head>

</div>

}
