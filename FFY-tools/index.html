<style>
  :root {
    --ffy-blue:   #214571;
    --ffy-green:  #45e7a3;
    --ffy-ink:    #0a141e;
    --ffy-white:  #ffffff;
    --ffy-bg:     #eff4fa;
    --ffy-arc:    #dfe9f6;
    --ffy-muted:  #548bc9;
    --ffy-border: #e3e8ef;
    --ffy-line:   #b1cae7;
    --header-h:   auto;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column;
    height: 100dvh;
    font-family: 'Albert Sans', 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
    color: var(--ffy-blue);
    background: var(--ffy-bg);
  }

  /* ---------- Horní lišta (vždy viditelná) ---------- */
  .topbar {
    flex: none;
    position: relative; z-index: 10;
    background: var(--ffy-white);
    border-bottom: 1px solid var(--ffy-border);
  }
  .topbar-row {
    display: flex; align-items: center; gap: 16px;
    padding: 12px 24px 8px;
  }
  .brand { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .brand-logo { height: 31px; width: auto; display: block; flex: none; } /* min. šířka 180 px dle manuálu */
  .brand-sep { width: 1px; height: 22px; background: var(--ffy-line); }
  .brand-label { font-weight: 700; font-size: 15px; letter-spacing: .01em; }
  .spacer { flex: 1; }
  .open-link {
    display: none; align-items: center; gap: 6px;
    font-size: 14px; font-weight: 600; color: var(--ffy-blue);
    text-decoration: none; padding: 7px 12px; border-radius: 8px;
    border: 1px solid var(--ffy-border);
  }
  .open-link:hover { background: var(--ffy-bg); }
  .open-link svg { width: 14px; height: 14px; }
  body.tool-active .open-link { display: inline-flex; }

  .tabs-wrap { position: relative; }
  .tabs {
    display: flex; gap: 4px;
    padding: 0 16px;
    overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs-wrap::before, .tabs-wrap::after {
    content: ""; position: absolute; top: 0; bottom: 0; width: 40px; pointer-events: none;
    opacity: 0; transition: opacity .15s; z-index: 1;
  }
  .tabs-wrap::before { left: 0; background: linear-gradient(90deg, #fff 30%, rgba(255,255,255,0)); }
  .tabs-wrap::after { right: 0; background: linear-gradient(270deg, #fff 30%, rgba(255,255,255,0)); }
  .tabs-wrap.more-left::before, .tabs-wrap.more-right::after { opacity: 1; }
  .tabs-arrow {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 2;
    width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--ffy-border);
    background: #fff; color: var(--ffy-blue); cursor: pointer; display: none;
    align-items: center; justify-content: center; padding: 0;
  }
  .tabs-arrow svg { width: 14px; height: 14px; }
  .tabs-arrow.l { left: 6px; } .tabs-arrow.r { right: 6px; }
  .tabs-wrap.more-left .tabs-arrow.l, .tabs-wrap.more-right .tabs-arrow.r { display: inline-flex; }
  .tabs-arrow:hover { background: var(--ffy-bg); }
  .tab {
    flex: none;
    position: relative;
    padding: 10px 12px 12px;
    font-size: 15px; font-weight: 600;
    color: var(--ffy-blue); text-decoration: none; white-space: nowrap;
    opacity: .72;
  }
  .tab:hover { opacity: 1; }
  .tab[aria-current="page"] { opacity: 1; }
  .tab[aria-current="page"]::after {
    content: ""; position: absolute; left: 12px; right: 12px; bottom: 0;
    height: 4px; background: var(--ffy-green); border-radius: 2px 2px 0 0;
  }
  .tab:focus-visible, .open-link:focus-visible, .card:focus-visible {
    outline: 2px solid var(--ffy-muted); outline-offset: 2px;
  }

  /* ---------- Obsah ---------- */
  main { flex: 1; min-height: 0; position: relative; }
  #frame {
    display: none; width: 100%; height: 100%; border: 0; background: var(--ffy-white);
  }
  body.tool-active #frame { display: block; }
  body.tool-active #home { display: none; }

  #home { height: 100%; overflow-y: auto; position: relative; }
  .arc {
    position: absolute; inset: 0; width: 100%; height: 100%;
    z-index: 0; pointer-events: none;
  }
  .home-inner { position: relative; z-index: 1; max-width: 1080px; margin: 0 auto; padding: 48px 24px 64px; }
  .eyebrow {
    display: inline-block; background: var(--ffy-green); color: var(--ffy-ink);
    font-size: 13px; font-weight: 700; padding: 3px 8px; border-radius: 2px;
  }
  h1 { font-size: clamp(32px, 5vw, 44px); font-weight: 800; line-height: 1.15; margin: 14px 0 10px; }
  .perex { font-size: 18px; line-height: 1.45; margin: 0 0 32px; max-width: 46ch; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .card {
    display: flex; flex-direction: column; gap: 8px;
    background: var(--ffy-white); border: 1px solid var(--ffy-border);
    border-radius: 21px 0 21px 0;
    padding: 20px 22px; text-decoration: none; color: var(--ffy-blue);
    transition: border-color .15s, transform .15s;
  }
  .card:hover { border-color: var(--ffy-green); transform: translateY(-2px); }
  .card-title { font-size: 18px; font-weight: 700; line-height: 1.25; }
  .card-desc { font-size: 14px; line-height: 1.5; color: var(--ffy-blue); opacity: .85; }
  .card-file { margin-top: auto; padding-top: 6px; font-size: 12px; color: var(--ffy-muted); }

  .note {
    background: var(--ffy-white); border-left: 4px solid var(--ffy-green);
    border-radius: 0 0 21px 0; padding: 16px 20px; font-size: 15px; line-height: 1.5; max-width: 640px;
  }
  .note code { background: var(--ffy-bg); padding: 1px 5px; border-radius: 4px; }

  @media (max-width: 640px) {
    .topbar-row { padding: 10px 16px 6px; gap: 10px; }
    .brand-label { font-size: 14px; }
    .open-link span { display: none; }
    .tabs { padding: 0 8px; }
    .tab { font-size: 14px; padding: 9px 10px 11px; }
    .home-inner { padding: 32px 16px 48px; }
  }
</style>

<main>
  <section id="home">

    </svg>

      <p class="perex">Kalkulačky, generátory a pomůcky pro práci FREE for YOU. Vyber nástroj nahoře nebo tady.</p>
      <div class="grid" id="grid"></div>
    </div>
  </section>

<script>
(function () {
  var tabsEl = document.getElementById('tabs');
  var gridEl = document.getElementById('grid');
  var frame  = document.getElementById('frame');
  var openLink = document.getElementById('openLink');
  var tools = [];

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function hrefFor(t) { return '#' + encodeURIComponent(t.file); }

  function render() {
    var tabs = '<a class="tab" href="#">Přehled</a>';
    var cards = '';
    tools.forEach(function (t) {
      tabs += '<a class="tab" href="' + hrefFor(t) + '" data-file="' + esc(t.file) + '">' + esc(t.title) + '</a>';
      cards += '<a class="card" href="' + hrefFor(t) + '">' +
                 '<span class="card-title">' + esc(t.title) + '</span>' +
                 (t.description ? '<span class="card-desc">' + esc(t.description) + '</span>' : '') +
                 '<span class="card-file">' + esc(t.file) + '</span>' +
               '</a>';
    });
    tabsEl.innerHTML = tabs;
    gridEl.innerHTML = cards || '<div class="note">Zatím tu nejsou žádné nástroje. Nahraj HTML soubor do složky a přidej ho do <code>tools.json</code>.</div>';
  }

  function route() {
    var file = decodeURIComponent(location.hash.replace(/^#/, ''));
    var tool = tools.filter(function (t) { return t.file === file; })[0];

    Array.prototype.forEach.call(tabsEl.querySelectorAll('.tab'), function (a) {
      var active = tool ? a.getAttribute('data-file') === tool.file : !a.hasAttribute('data-file');
      if (active) { a.setAttribute('aria-current', 'page'); a.scrollIntoView({ block: 'nearest', inline: 'center' }); }
      else a.removeAttribute('aria-current');
    });

    try { localStorage.setItem('ffy-tools-last', tool ? tool.file : ''); } catch (e) {}
    if (tool) {
      if (frame.getAttribute('src') !== tool.file) frame.setAttribute('src', tool.file);
      frame.title = tool.title;
      openLink.href = tool.file;
      document.title = tool.title + ' · FFY nástroje';
      document.body.classList.add('tool-active');
    } else {
      document.body.classList.remove('tool-active');
      document.title = 'FFY nástroje';
    }
  }

  // Záložní seznam pro případ, že tools.json chybí. Hlavní zdroj je tools.json (doplňuje ho GitHub Action).
  var FALLBACK = [{"file": "simulator-ceny-proudiku.html", "title": "Simulátor Proudíku", "description": "Cena Proudíku podle počtu odběrných míst, výroby zdrojů a ceny za MWh. Šoupátka, scénáře a graf."}, {"file": "kalkulacka-eoz.html", "title": "Kalkulačka EOZ", "description": "Rozdělení přetoků ze zdrojů mezi odběrná místa podle proudíků, obě iterace metodiky."}, {"file": "psc-distributor.html", "title": "Distributor podle PSČ", "description": "Zjistí distributora elektřiny a plynu podle PSČ odběrného místa."}, {"file": "porovnani-nabidek.html", "title": "Porovnání nabídek", "description": "Roční cena u FFY a u konkurence s rozpadem na obchodní část, distribuci a daně. Našeptávač dodavatelů."}, {"file": "ceniky-dodavatelu.html", "title": "Ceníky dodavatelů", "description": "Obchodní ceny všech dodavatelů ze srovnávače ERÚ, denně aktualizované, s historií změn."}, {"file": "ceny-konkurence.html", "title": "Ceny konkurence", "description": "Stáhne aktuální tarify elektřiny a plynu všech dodavatelů z kurzy.cz a porovná je podle kraje a sazby."}, {"file": "spotove-ceny.html", "title": "Spotové ceny", "description": "Spotové ceny elektřiny a plynu z OTE za dva roky. Graf s odečtem ceny v libovolné chvíli."}, {"file": "qr-generator.html", "title": "QR generátor", "description": "Odkazy, platební QR, vizitky a kampaně s UTM. Stažení v PNG i SVG."}, {"file": "generator-emailu.html", "title": "Generátor e-mailů", "description": "Vyplní šablonu e-mailové kampaně: karty, kroky, CTA a placeholdery."}, {"file": "pdf-pozadi.html", "title": "PDF pozadí", "description": "Podloží firemní pozadí pod PDF dokument, ukáže náhled a vyexportuje hotové PDF."}, {"file": "okenka-se-jmeny.html", "title": "Okénka se jmény", "description": "Jmenovky s pozicí jako PNG s průhledným pozadím, hromadně v ZIPu."}];

  function useList(data) {
    tools = (Array.isArray(data) ? data : data.tools || [])
      .filter(function (t) { return t && t.file; })
      .map(function (t) { return { file: t.file, title: t.title || t.file.replace(/\.html?$/i, ''), description: t.description || '' }; });
    render();
    if (!location.hash) {
      var lastFile = null; try { lastFile = localStorage.getItem('ffy-tools-last'); } catch (e) {}
      if (lastFile && tools.some(function (t) { return t.file === lastFile; })) { history.replaceState(null, '', '#' + encodeURIComponent(lastFile)); }
    }
    route(); fades();
  }

  fetch('tools.json', { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (data) { useList(data && (data.length || (data.tools && data.tools.length)) ? data : FALLBACK); })
    .catch(function () { useList(FALLBACK); });

  function fades() {
    var w = document.getElementById('tabsWrap');
    w.classList.toggle('more-left', tabsEl.scrollLeft > 4);
    w.classList.toggle('more-right', tabsEl.scrollLeft + tabsEl.clientWidth < tabsEl.scrollWidth - 4);
  }
  tabsEl.addEventListener('scroll', fades, { passive: true });
  Array.prototype.forEach.call(document.querySelectorAll('.tabs-arrow'), function (btn) {
    btn.addEventListener('click', function () { tabsEl.scrollBy({ left: +btn.dataset.dir * Math.max(200, tabsEl.clientWidth * 0.6), behavior: 'smooth' }); });
  });
  window.addEventListener('resize', fades);
  window.addEventListener('hashchange', route);
})();
</script>
